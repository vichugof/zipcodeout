name: ci

on:
  push:
    # Tags are tested and released by release.yml.
    branches: ["**"]
  pull_request:
  workflow_dispatch:
  schedule:
    # Mondays: check that the real providers still answer the way the tool expects.
    - cron: "17 6 * * 1"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  GO_VERSION: "1.26.x"

jobs:
  lint:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: go.mod
      - name: Vet for Linux and Windows
        run: |
          go vet ./...
          GOOS=windows go vet ./...
      # Also reports files that gofumpt or goimports would change.
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.11.1

  test:
    if: github.event_name != 'schedule'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: go.mod
      # The race detector needs cgo; it runs on Linux only.
      - name: Unit and end-to-end tests
        run: |
          race=
          if [ "$RUNNER_OS" = Linux ]; then race=-race; fi
          go test $race -count=1 ./...

  cross:
    if: github.event_name != 'schedule'
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: go.mod
      - run: make cross
      - uses: actions/upload-artifact@v7
        with:
          name: zipcode-binaries
          path: dist/

  live:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: go.mod
      - name: Query the real providers
        run: go test -count=1 -run TestLive -v ./cmd/zipcode
        env:
          ZIPCODE_LIVE_TEST: "1"
